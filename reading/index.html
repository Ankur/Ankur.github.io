<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankur Jain — Reading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../index.css">
    <style>
        #recently-read {
            gap: 0.75rem;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <nav>
        <a href="../">about</a>
        <a href="../music/">music</a>
        <a href="./">reading</a>
    </nav>
    <div class="container">
        <div class="content">
            <h1>reading</h1>
            <p class="tagline">pulled from <a href="https://www.goodreads.com/user/show/100350191-ankur-jain" target="_blank">goodreads</a></p>

            <div class="section">
                <p class="section-header">recently read:</p>
                <div class="items" id="recently-read">
                    <p class="loading">loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GIST_ID = '379f9191e9bb1552cbea6bf2907f9276';

        function renderItems(containerId, items) {
            const el = document.getElementById(containerId);
            el.innerHTML = items.map(text => `<p>- ${text}</p>`).join('');
        }

        function renderError(containerId, msg) {
            const el = document.getElementById(containerId);
            el.innerHTML = `<p>- ${msg || 'could not load data'}</p>`;
        }

        async function loadRecentlyRead() {
            try {
                const res = await fetch(`https://api.github.com/gists/${GIST_ID}`);
                if (!res.ok) throw new Error('failed to fetch gist');

                const gist = await res.json();
                const file = gist.files['goodreads-books.json'];
                if (!file) throw new Error('no goodreads data in gist');

                const data = JSON.parse(file.content);
                const books = data.books || [];

                if (books.length === 0) {
                    renderError('recently-read', 'no books yet');
                    return;
                }

                renderItems('recently-read', books.map(b =>
                    `<a href="https://www.goodreads.com/book/show/${b.bookId}" target="_blank">${b.title}</a> — ${b.author}`
                ));
            } catch (e) {
                renderError('recently-read');
            }
        }

        loadRecentlyRead();
    </script>
</body>
</html>
