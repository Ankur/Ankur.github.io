<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankur Jain — Music</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../index.css">
</head>
<body>
    <nav>
        <a href="../">about</a>
        <a href="./">music</a>
        <a href="../reading/">reading</a>
    </nav>
    <div class="container">
        <div class="content">
            <h1>music</h1>
            <p class="tagline">pulled from spotify</p>

            <div class="section">
                <p class="section-header">now playing:</p>
                <div class="items" id="now-playing">
                    <p class="loading">loading...</p>
                </div>
            </div>

            <div class="section-group">
                <div class="section">
                    <p class="section-header">all time:</p>
                    <div class="items" id="all-time-stats">
                        <p class="loading">loading...</p>
                    </div>
                </div>
                <div class="section subsection">
                    <p class="section-header">top artists:</p>
                    <div class="items" id="top-artists-alltime">
                        <p class="loading">loading...</p>
                    </div>
                </div>
                <div class="section subsection">
                    <p class="section-header">top tracks:</p>
                    <div class="items" id="top-tracks-alltime">
                        <p class="loading">loading...</p>
                    </div>
                </div>
            </div>

            <div class="section-group">
                <p class="section-header">recently (last 90 days):</p>
                <div class="section subsection">
                    <p class="section-header">top artists:</p>
                    <div class="items" id="top-artists-recent">
                        <p class="loading">loading...</p>
                    </div>
                </div>
                <div class="section subsection">
                    <p class="section-header">top tracks:</p>
                    <div class="items" id="top-tracks-recent">
                        <p class="loading">loading...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GIST_ID = '379f9191e9bb1552cbea6bf2907f9276';

        function renderItems(containerId, items) {
            const el = document.getElementById(containerId);
            el.innerHTML = items.map(text => `<p>- ${text}</p>`).join('');
        }

        function renderError(containerId, msg) {
            const el = document.getElementById(containerId);
            el.innerHTML = `<p class="loading">${msg || 'could not load data'}</p>`;
        }

        function fmtHours(ms) {
            return (ms / 3600000).toFixed(1) + 'h';
        }

        function trackUri2Url(uri) {
            if (!uri) return null;
            const parts = uri.split(':');
            if (parts.length === 3 && parts[0] === 'spotify' && parts[1] === 'track') {
                return `https://open.spotify.com/track/${parts[2]}`;
            }
            return null;
        }

        async function loadAllStats() {
            try {
                const res = await fetch(`https://api.github.com/gists/${GIST_ID}`);
                if (!res.ok) throw new Error(`Gist fetch failed: ${res.status}`);
                const gist = await res.json();

                // Now playing
                try {
                    const np = JSON.parse(gist.files['now-playing.json'].content);
                    if (!np.is_playing || !np.track) {
                        renderError('now-playing', 'nothing playing right now');
                    } else {
                        const link = np.url
                            ? `<a href="${np.url}" target="_blank">${np.track}</a>`
                            : np.track;
                        renderItems('now-playing', [`${link} — ${np.artist}`]);
                    }
                } catch (e) {
                    renderError('now-playing', 'could not load now playing');
                }

                // Stats
                if (!gist.files['stats.json']) {
                    const msg = 'stats not yet computed — check back soon!';
                    ['all-time-stats', 'top-artists-alltime', 'top-tracks-alltime',
                     'top-artists-recent', 'top-tracks-recent'].forEach(id => renderError(id, msg));
                    return;
                }

                const stats = JSON.parse(gist.files['stats.json'].content);

                // All-time summary
                const days = (stats.total_ms_played / 86400000).toFixed(1);
                renderItems('all-time-stats', [`${days} days of music since 2013`]);

                // Top artists all-time
                if (stats.top_artists_alltime && stats.top_artists_alltime.length > 0) {
                    renderItems('top-artists-alltime', stats.top_artists_alltime.map(a =>
                        `${a.name || 'unknown artist'} (${fmtHours(a.ms_played)})`
                    ));
                } else {
                    renderError('top-artists-alltime', 'no data');
                }

                // Top tracks all-time
                if (stats.top_tracks_alltime && stats.top_tracks_alltime.length > 0) {
                    renderItems('top-tracks-alltime', stats.top_tracks_alltime.map(t => {
                        const url = trackUri2Url(t.uri);
                        const nameLink = url
                            ? `<a href="${url}" target="_blank">${t.name}</a>`
                            : t.name;
                        return `${nameLink} — ${t.artist || 'unknown'} (${fmtHours(t.ms_played)})`;
                    }));
                } else {
                    renderError('top-tracks-alltime', 'no data');
                }

                // Top artists recently
                if (stats.top_artists_recent && stats.top_artists_recent.length > 0) {
                    renderItems('top-artists-recent', stats.top_artists_recent.map(a =>
                        `${a.name || 'unknown artist'} (${fmtHours(a.ms_played)})`
                    ));
                } else {
                    renderError('top-artists-recent', 'no data');
                }

                // Top tracks recently
                if (stats.top_tracks_recent && stats.top_tracks_recent.length > 0) {
                    renderItems('top-tracks-recent', stats.top_tracks_recent.map(t => {
                        const url = trackUri2Url(t.uri);
                        const nameLink = url
                            ? `<a href="${url}" target="_blank">${t.name}</a>`
                            : t.name;
                        return `${nameLink} — ${t.artist || 'unknown'} (${fmtHours(t.ms_played)})`;
                    }));
                } else {
                    renderError('top-tracks-recent', 'no data');
                }

            } catch (e) {
                ['now-playing', 'all-time-stats', 'top-artists-alltime', 'top-tracks-alltime',
                 'top-artists-recent', 'top-tracks-recent'].forEach(id =>
                    renderError(id, 'could not load data')
                );
            }
        }

        loadAllStats();
    </script>
</body>
</html>
